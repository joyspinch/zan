name: ci
on: [push, pull_request]
jobs:
  bootstrap-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch bootstrap seed (certified checkpoint release)
        run: |
          curl -sL -o seed.zip https://github.com/joyspinch/zan/releases/download/seed-kr6bUF/zan-seed-kr6bUF-macos-arm64.zip
          unzip -o seed.zip -d seed/
          chmod +x seed/stage2
      - name: Bootstrap to fixed point
        run: SEED=$PWD/seed/stage2 RT_OBJS='' bash scripts/native_bootstrap.sh
      - name: Conformance regression
        run: python3 scripts/native_regression.py --seed $(ls -dt build/native-bootstrap/run.*/stage2 | head -1)
      - name: Upload bootstrap artifacts (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-artifacts
          path: |
            build/native-bootstrap/*/stage1.o
            build/native-bootstrap/*/stage2.o
          if-no-files-found: ignore
