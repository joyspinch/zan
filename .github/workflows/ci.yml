name: ci
on: [push, pull_request]
jobs:
  bootstrap-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap to fixed point
        run: SEED=${{ secrets.SEED_URL && '' || 'SKIP' }} bash scripts/native_bootstrap.sh || true
        id: boot
      - name: Bootstrap (self seed fallback)
        run: bash scripts/native_bootstrap.sh
      - name: Conformance regression
        run: python3 scripts/native_regression.py --seed $(ls -dt build/native-bootstrap/run.*/stage2 | head -1)
